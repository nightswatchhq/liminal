name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the
  # same gate. Bump deliberately.
  YATR_VERSION: "1.1.0"

jobs:
  build-test-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with wasm32-wasip2)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # Compile every component from source for the wasm target. cargo test uses
      # the committed .wasm binaries, so this is what catches component breakage.
      # Builds to target/ — it does NOT overwrite the committed examples/*.wasm,
      # so the attestation below still checks the signed artifacts.
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - name: Build components (wasm32-wasip2)
        run: yatr components

      - name: Test (host, manifest validation, capability + compliance enforcement)
        run: yatr test

      # The compliance gate: verify the signed Customs composition against the
      # committed component binaries. A drift in topology, capability boundaries,
      # or component bytes fails the build.
      - name: Verify Customs attestation
        run: yatr attest
