# yatr - https://github.com/cargopete/yatr
#
# These tasks are what .github/workflows CI runs, command for command, so
# `yatr ci` locally is the same gate. The workflow calls these tasks by name:
# change a command here and CI changes with it.
#
# The aggregate is `ci`, not `check`: `yatr check` is a builtin that validates
# this file and shadows any task of that name without warning.

[env]
RUST_BACKTRACE = "1"

[settings]
cache = true

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["cargo fmt --all --check"]
sources = ["**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied"
run = ["cargo clippy --all-targets -- -D warnings"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.components]
desc = "Build every pipeline component for wasm32-wasip2 (CI: Build components)"
run = ["cargo build --target wasm32-wasip2 --release -p arb-decoder -p arb-enricher -p arb-sink-json -p uni-v3-decoder -p uni-v3-price-enricher -p uni-v3-sink-postgres -p uni-v3-sink-kafka -p customs-decoder -p customs-screener -p customs-screener-http -p customs-enricher -p customs-sink-sor -p customs-sink-kafka -p customs-sink-quarantine -p customs-sink-hold"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "wit/**/*.wit"]

[tasks.test]
desc = "Host tests: manifests, capability and compliance enforcement (CI: Test)"
run = ["cargo test -p liminal-host"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]
watch = ["**/*.rs"]

[tasks.attest]
desc = "Verify the Customs pipeline attestation (CI: Verify Customs attestation)"
run = ["cargo run --release -p liminal-host -- compose verify examples/customs/customs.pipeline.toml --sig examples/customs/customs.pipeline.toml.sig --pub examples/customs/customs.pub"]
depends = ["components"]
no_cache = true

[tasks.build]
desc = "Release build of the host"
run = ["cargo build --release -p liminal-host"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.ci]
desc = "What CI runs: components, test, attest"
depends = ["components", "test", "attest"]
run = []
